name: Build full IPA from source

# The first workflow that builds EVERYTHING the app links, from a clean checkout,
# and packages an unsigned IPA. Every step here was worked out separately first:
#
#   FEX for iOS            fex-ios.yml        toolchain file, TUNE_CPU=none,
#                                             FEX_IOS_HOST, static targets only
#   libntdll_unix.a        unix-libs.yml      wine configure + 345 IDL headers
#   libwin32u_unix.a       unix-libs.yml      + gnutls/freetype for iOS
#   libwineserver.a        unix-libs.yml      make-base.sh (all 44 sources)
#   LLVM 15 for iOS        llvm-ios.yml       cached; AddLLVM Darwin|iOS, no tools
#   libdxmt_combined.a     here               build.sh + libtool merge with LLVM
#   44 Wine PE DLLs        wine-pe-dlls.yml   XAudio2 family etc, ARM64X hybrids
#   x86_64 VC++ runtime    windows runner     WiX bundle defeats 7-Zip
#
# D3D12 (input dx12, default on):
#   MoltenVK for iOS       here               static, cached; -force_load at link
#   winevulkan unixlib     ntdll-unix         built when libMoltenVK.a is present
#   win32u Vulkan + driver win32u-unix        vulkan_ios.c / vulkan_ios_drv.c
#   d3d12.dll/d3d12core    vkd3d-proton-pe    ARM64X, with the DXGI swapchain bridge
#
# Every expensive stage is cached the moment it finishes (cache/save straight
# after the build step, not at job end), keyed on the submodule commit plus the
# hash of the scripts that build it. Run 35181977353 spent ~2.5 h reaching the
# DXMT step and then failed there; with these caches a re-run resumes at the
# first stage whose inputs changed.
#
# Nothing is published. The IPA is a private, expiring artifact.

on:
  workflow_dispatch:
    inputs:
      dx12:
        description: "Include D3D12 (vkd3d-proton + winevulkan + MoltenVK)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  MOLTENVK_TAG: v1.4.2

jobs:
  # ---------------------------------------------------------------------------
  vcruntime:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Collect the x64 CRT from the Visual Studio redist
        shell: pwsh
        run: |
          $wanted = @('concrt140.dll','msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll',
                      'msvcp140_atomic_wait.dll','msvcp140_codecvt_ids.dll','vcamp140.dll',
                      'vccorlib140.dll','vcomp140.dll','vcruntime140.dll',
                      'vcruntime140_1.dll','vcruntime140_threads.dll')
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $roots = Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Redist\MSVC' -Directory -ErrorAction SilentlyContinue
          if (-not $roots) { Write-Error 'no VC Redist directory'; exit 1 }
          foreach ($name in $wanted) {
            $hit = Get-ChildItem -Path $roots.FullName -Recurse -Filter $name -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
            if ($hit) { Copy-Item $hit.FullName -Destination "out\$name"; "OK  $name" } else { "MISSING $name" }
          }
          if ((Get-ChildItem out).Count -lt 10) { Write-Error 'too few CRT DLLs'; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-vcruntime
          path: out/
          retention-days: 1

  # ---------------------------------------------------------------------------
  pe-dlls:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      TARGETS: "xaudio2_0 xaudio2_1 xaudio2_2 xaudio2_3 xaudio2_4 xaudio2_5 xaudio2_6 xaudio2_7 xaudio2_8 xaudio2_9 x3daudio1_0 x3daudio1_1 x3daudio1_2 x3daudio1_3 x3daudio1_4 x3daudio1_5 x3daudio1_6 x3daudio1_7 xapofx1_1 xapofx1_2 xapofx1_3 xapofx1_4 xapofx1_5 xinput1_1 xinput1_2 xinput1_3 xinput1_4 xinput9_1_0 d3d8 d3d10 d3d10_1 ddraw dinput msvcp100 msvcp110 msvcp120 msvcr100 msvcr110 atl100 dxdiagn wbemprox xolehlp winevulkan vulkan-1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache key
        id: key
        run: |
          WINE_SHA=$(git ls-tree HEAD wine | awk '{print $3}')
          LIST=$(printf '%s' "$TARGETS" | shasum | cut -c1-12)
          echo "key=pedlls-v1-${WINE_SHA}-${LIST}" >> "$GITHUB_OUTPUT"

      - name: Restore PE DLLs
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: out
          key: ${{ steps.key.outputs.key }}

      - name: Fetch wine
        if: steps.cache.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 wine
      - name: Host deps
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential flex bison pkg-config gettext autoconf perl python3 curl xz-utils
      - name: Install llvm-mingw
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh api repos/mstorsjo/llvm-mingw/releases/latest --jq '.assets[] | select(.name|endswith("ucrt-ubuntu-22.04-x86_64.tar.xz")) | .browser_download_url')
          if [ -z "$URL" ]; then echo "::error::no llvm-mingw asset"; exit 1; fi
          curl -fsSL "$URL" -o /tmp/lm.tar.xz
          sudo mkdir -p /opt && sudo tar -xf /tmp/lm.tar.xz -C /opt
          echo "$(ls -d /opt/llvm-mingw-* | head -1)/bin" >> "$GITHUB_PATH"
      - name: Configure wine (aarch64 + arm64ec PE)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: wine
        run: |
          ./configure --enable-archs=aarch64,arm64ec --without-x --without-freetype --without-fontconfig --without-alsa --without-oss --without-pulse --without-coreaudio --without-gstreamer --without-opengl --without-vulkan --disable-tests 2>&1 | tail -10
      - name: Build the PE DLLs games miss
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: wine
        run: |
          make -j"$(nproc)" tools 2>&1 | tail -3
          BUILT=0
          for t in $TARGETS; do
            if make -j"$(nproc)" "dlls/$t/aarch64-windows/$t.dll" > /tmp/m.log 2>&1; then BUILT=$((BUILT+1)); else echo "FAILED $t"; tail -3 /tmp/m.log; fi
          done
          echo "BUILT: $BUILT"
          mkdir -p ../out
          find dlls -path "*/aarch64-windows/*.dll" -exec cp {} ../out/ ';'
          ls ../out | wc -l
      - name: Save PE DLLs
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out
          key: ${{ steps.key.outputs.key }}

      - uses: actions/upload-artifact@v4
        with:
          name: extra-pe-dlls
          path: out/
          retention-days: 1

  # ---------------------------------------------------------------------------
  vkd3d:
    if: ${{ inputs.dx12 }}
    uses: ./.github/workflows/vkd3d-proton-pe.yml
    with:
      ref: v3.0.1
      llvm_mingw: latest

  # ---------------------------------------------------------------------------
  ipa:
    needs: [vcruntime, pe-dlls, vkd3d]
    # vkd3d is skipped when dx12 is off; that must not skip this job.
    if: ${{ !cancelled() && needs.vcruntime.result == 'success' && needs.pe-dlls.result == 'success' && (needs.vkd3d.result == 'success' || needs.vkd3d.result == 'skipped') }}
    runs-on: macos-latest
    timeout-minutes: 330
    # Explicit `shell: bash` means -eo pipefail. The implicit default is
    # `bash -e` WITHOUT pipefail, so `build.sh | tail` used to pass even when
    # build.sh failed.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # FEX always, and BEFORE any cache restore: the app compiles against
      # FEX's headers, and restoring FEX/build-ios first leaves a non-empty
      # FEX/ that git then refuses to clone the submodule into.
      - name: FEX submodule
        run: |
          git submodule update --init --depth 1 FEX
          (cd FEX && git submodule update --init --depth 1 --recursive External 2>&1 | tail -3) || true

      - name: Cache keys
        id: keys
        run: |
          FEX_SHA=$(git ls-tree HEAD FEX | awk '{print $3}')
          WINE_SHA=$(git ls-tree HEAD wine | awk '{print $3}')
          DXMT_SHA=$(git ls-tree HEAD research/dxmt | awk '{print $3}')
          {
            echo "fex=fexlibs-v1-${FEX_SHA}-${{ hashFiles('build/fex-ios/**') }}"
            # dx12 in the key: with MoltenVK present the unix libs gain
            # winevulkan and the Vulkan-enabled win32u, so they differ.
            echo "unix=unixlibs-v1-dx12${{ inputs.dx12 }}-${WINE_SHA}-${{ hashFiles('build/ntdll-unix/**', 'build/win32u-unix/**', 'build/crypto-unix/**', 'build/wineserver/**', 'build/gnutls-ios/**', 'build/freetype-ios/**') }}"
            echo "dxmt=dxmtlib-v1-${DXMT_SHA}-${{ hashFiles('build/dxmt-ios/**') }}"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Restore FEX libraries
        id: fex
        uses: actions/cache/restore@v4
        with:
          # The whole build tree minus objects: FEXBridge.mm compiles against
          # generated headers in build-ios/include, not just the archives.
          path: |
            FEX/build-ios
            !FEX/build-ios/**/*.o
          key: ${{ steps.keys.outputs.fex }}

      - name: Restore Wine unix libraries
        id: unix
        uses: actions/cache/restore@v4
        with:
          path: |
            app/Madeira/libntdll_unix.a
            app/Madeira/libwin32u_unix.a
            app/Madeira/libwineserver.a
          key: ${{ steps.keys.outputs.unix }}

      - name: Restore DXMT library
        id: dxmt
        uses: actions/cache/restore@v4
        with:
          path: app/Madeira/libdxmt_combined.a
          key: ${{ steps.keys.outputs.dxmt }}

      - name: Cache status
        run: |
          echo "FEX  hit=${{ steps.fex.outputs.cache-hit }}"
          echo "unix hit=${{ steps.unix.outputs.cache-hit }}"
          echo "DXMT hit=${{ steps.dxmt.outputs.cache-hit }}"

      - name: Submodules (only those still to build)
        run: |
          if [ "${{ steps.unix.outputs.cache-hit }}" != "true" ]; then
            git submodule update --init --depth 1 wine
          fi
          if [ "${{ steps.dxmt.outputs.cache-hit }}" != "true" ]; then
            git submodule update --init --depth 1 --recursive research/dxmt
          fi
          for d in FEX wine research/dxmt; do [ -d "$d/.git" ] || [ -f "$d/.git" ] && echo "  $d $(du -sh "$d" | cut -f1)"; done; true

      - name: Xcode 26
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version | head -1
          SDKV=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDKV"
          if [ "${SDKV%%.*}" -lt 26 ]; then echo "::error::need iOS 26 SDK (glassEffect)"; exit 1; fi

      - name: Host tools
        run: |
          brew install ninja bison flex python-packaging || true
          python3 -c 'import packaging; print("packaging OK")'

      # ---- FEX -----------------------------------------------------------
      - name: FEXCore for iOS
        if: steps.fex.outputs.cache-hit != 'true'
        run: bash build/fex-ios/build.sh 2>&1 | tail -15

      - name: Save FEX libraries
        if: steps.fex.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          # The whole build tree minus objects: FEXBridge.mm compiles against
          # generated headers in build-ios/include, not just the archives.
          path: |
            FEX/build-ios
            !FEX/build-ios/**/*.o
          key: ${{ steps.keys.outputs.fex }}

      # ---- MoltenVK (D3D12) ----------------------------------------------
      # Must exist before the unix libraries build: ntdll-unix and win32u-unix
      # switch their Vulkan parts on when app/Madeira/libMoltenVK.a is there.
      - name: Restore MoltenVK
        if: ${{ inputs.dx12 }}
        id: mvk
        uses: actions/cache/restore@v4
        with:
          path: app/Madeira/libMoltenVK.a
          key: moltenvk-ios-v1-${{ env.MOLTENVK_TAG }}

      - name: MoltenVK for iOS
        if: ${{ inputs.dx12 && steps.mvk.outputs.cache-hit != 'true' }}
        run: |
          git clone --depth 1 --branch "$MOLTENVK_TAG" https://github.com/KhronosGroup/MoltenVK.git "$RUNNER_TEMP/MoltenVK"
          cd "$RUNNER_TEMP/MoltenVK"
          ./fetchDependencies --ios 2>&1 | tail -5
          make ios 2>&1 | tail -15
          LIB=$(find Package -name libMoltenVK.a -path '*ios-arm64/*' | head -1)
          if [ -z "$LIB" ]; then LIB=$(find Package -name libMoltenVK.a | grep -v -i simulator | head -1); fi
          if [ -z "$LIB" ]; then echo "::error::no libMoltenVK.a"; find Package -maxdepth 6 | head -30; exit 1; fi
          lipo -info "$LIB"
          cp "$LIB" "$GITHUB_WORKSPACE/app/Madeira/libMoltenVK.a"
          ls -lh "$GITHUB_WORKSPACE/app/Madeira/libMoltenVK.a"

      - name: Save MoltenVK
        if: ${{ inputs.dx12 && steps.mvk.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: app/Madeira/libMoltenVK.a
          key: moltenvk-ios-v1-${{ env.MOLTENVK_TAG }}

      - name: MoltenVK exports what win32u binds to
        if: ${{ inputs.dx12 }}
        run: |
          for sym in vkGetInstanceProcAddr vkGetDeviceProcAddr vkCreateMetalSurfaceEXT; do
            if nm -g app/Madeira/libMoltenVK.a 2>/dev/null | grep -q " T _$sym$"; then echo "  OK      $sym"; else echo "  MISSING $sym"; exit 1; fi
          done

      # ---- Wine unix side ------------------------------------------------
      - name: llvm-mingw (wine configure needs a PE cross-compiler)
        if: steps.unix.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh api repos/mstorsjo/llvm-mingw/releases/latest --jq '.assets[] | select(.name|endswith("ucrt-macos-universal.tar.xz")) | .browser_download_url')
          if [ -z "$URL" ]; then echo "::error::no llvm-mingw asset"; exit 1; fi
          curl -fsSL "$URL" -o /tmp/lm.tar.xz
          sudo mkdir -p /opt && sudo tar -xf /tmp/lm.tar.xz -C /opt
          echo "$(ls -d /opt/llvm-mingw-* | head -1)/bin" >> "$GITHUB_PATH"

      - name: Wine configure + IDL headers
        if: steps.unix.outputs.cache-hit != 'true'
        run: |
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          mkdir -p wine/build-macos && cd wine/build-macos
          ../configure --enable-win64 --without-x --without-freetype --without-fontconfig --without-gstreamer --without-vulkan --without-opengl --without-alsa --without-oss --without-pulse --without-sane --without-usb --without-capi --without-gphoto --disable-tests 2>&1 | tail -5
          make -j"$(sysctl -n hw.ncpu)" tools 2>&1 | tail -3 || true
          made=0
          for idl in ../include/*.idl; do
            if make "include/$(basename "$idl" .idl).h" >/dev/null 2>&1; then made=$((made+1)); fi
          done
          echo "IDL headers: $made"

      - name: gnutls + freetype for iOS
        if: steps.unix.outputs.cache-hit != 'true'
        run: |
          if [ ! -d research/freetype ]; then
            git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git research/freetype
          fi
          bash build/gnutls-ios/build.sh 2>&1 | tail -6
          bash build/freetype-ios/build.sh 2>&1 | tail -3

      - name: libntdll_unix.a + libwin32u_unix.a
        if: steps.unix.outputs.cache-hit != 'true'
        run: |
          bash build/ntdll-unix/build.sh > /tmp/ntdll.log 2>&1 || { tail -40 /tmp/ntdll.log; exit 1; }
          grep -E 'winevulkan|MoltenVK|Results' /tmp/ntdll.log || true
          tail -3 /tmp/ntdll.log
          bash build/win32u-unix/build.sh > /tmp/win32u.log 2>&1 || { tail -40 /tmp/win32u.log; for e in build/win32u-unix/obj/*.err; do [ -s "$e" ] && { echo "== $e"; grep -m 10 error "$e" || true; }; done; exit 1; }
          grep -E 'Vulkan|vulkan|Results' /tmp/win32u.log || true
          tail -3 /tmp/win32u.log
          if [ "${{ inputs.dx12 }}" = "true" ] && ! grep -q 'winevulkan_unixlib... OK' /tmp/ntdll.log; then
            echo "::error::dx12 requested but the winevulkan unixlib did not build"
            for e in build/ntdll-unix/obj/winevulkan_*.err; do [ -s "$e" ] && { echo "== $e"; grep -m 15 error "$e" || true; }; done
            exit 1
          fi

      - name: libwineserver.a (base + patches)
        if: steps.unix.outputs.cache-hit != 'true'
        run: |
          bash build/wineserver/make-base.sh 2>&1 | tail -8
          bash build/wineserver/build.sh 2>&1 | tail -8

      - name: Save Wine unix libraries
        if: steps.unix.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/Madeira/libntdll_unix.a
            app/Madeira/libwin32u_unix.a
            app/Madeira/libwineserver.a
          key: ${{ steps.keys.outputs.unix }}

      # ---- DXMT ----------------------------------------------------------
      - name: Restore LLVM 15 for iOS
        if: steps.dxmt.outputs.cache-hit != 'true'
        id: llvm
        uses: actions/cache/restore@v4
        with:
          path: toolchains/llvm-ios-build
          key: llvm-ios-llvmorg-15.0.7-v1

      - name: LLVM source headers (DXMT includes both build and source trees)
        if: steps.dxmt.outputs.cache-hit != 'true'
        run: |
          if [ "${{ steps.llvm.outputs.cache-hit }}" != "true" ]; then
            echo "::error::LLVM iOS cache miss - run llvm-ios.yml first"; exit 1
          fi
          echo "iOS LLVM static libs: $(ls toolchains/llvm-ios-build/lib/*.a | wc -l | tr -d ' ')"
          git clone --depth 1 --branch llvmorg-15.0.7 --filter=blob:none --sparse https://github.com/llvm/llvm-project.git toolchains/llvm-project
          (cd toolchains/llvm-project && git sparse-checkout set llvm/include)
          ls toolchains/llvm-project/llvm/include | head -3

      - name: libdxmt_combined.a
        if: steps.dxmt.outputs.cache-hit != 'true'
        run: |
          xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -2 || true
          if ! bash build/dxmt-ios/build.sh > /tmp/dxmt.log 2>&1; then
            tail -30 /tmp/dxmt.log
            for e in build/dxmt-ios/obj/*.err; do
              if [ -s "$e" ]; then echo "=== $e"; grep -E 'error' "$e" | head -15 || true; fi
            done
            exit 1
          fi
          tail -8 /tmp/dxmt.log
          xcrun -sdk iphoneos libtool -static -o build/dxmt-ios/libdxmt_combined.a build/dxmt-ios/obj/*.o toolchains/llvm-ios-build/lib/*.a
          cp build/dxmt-ios/libdxmt_combined.a app/Madeira/
          ls -lh app/Madeira/libdxmt_combined.a

      - name: Save DXMT library
        if: steps.dxmt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/Madeira/libdxmt_combined.a
          key: ${{ steps.keys.outputs.dxmt }}

      # ---- Assemble ------------------------------------------------------
      - uses: actions/download-artifact@v4
        with:
          name: x86_64-vcruntime
          path: app/Madeira/x86_64-vcruntime

      - uses: actions/download-artifact@v4
        with:
          name: extra-pe-dlls
          path: extra-dlls

      - uses: actions/download-artifact@v4
        if: ${{ inputs.dx12 }}
        with:
          name: vkd3d-proton-arm64ec
          path: vkd3d-dlls

      # ADD only. Upstream's DLLs carry iOS patches; never overwrite one. These
      # are ARM64X hybrids, so the same file serves both directories.
      - name: Merge extra DLLs without overwriting upstream's
        run: |
          for dir in aarch64-windows arm64ec-windows; do
            added=0
            for f in extra-dlls/*.dll; do
              n=$(basename "$f")
              if [ ! -e "app/Madeira/$dir/$n" ]; then cp "$f" "app/Madeira/$dir/$n"; added=$((added+1)); fi
            done
            echo "$dir: +$added (now $(ls app/Madeira/$dir | wc -l | tr -d ' '))"
          done
          ls app/Madeira/arm64ec-windows | grep -E '^xaudio2_9|^x3daudio1_7' || echo "::warning::xaudio2 not merged"

      # The one deliberate REPLACE. Upstream's d3d12.dll is Wine's vkd3d build,
      # which needs Wine's own dxgi.dll for swapchains and can never present
      # through DXMT's. vkd3d-proton's d3d12.dll + d3d12core.dll (with the DXGI
      # bridge) take its place; winevulkan.dll and vulkan-1.dll come from the
      # extra PE DLLs above.
      - name: D3D12 DLLs (vkd3d-proton)
        if: ${{ inputs.dx12 }}
        run: |
          for dir in aarch64-windows arm64ec-windows; do
            for n in d3d12.dll d3d12core.dll; do cp "vkd3d-dlls/$n" "app/Madeira/$dir/$n"; done
            for n in winevulkan.dll vulkan-1.dll d3d12.dll d3d12core.dll; do
              if [ -f "app/Madeira/$dir/$n" ]; then echo "  OK      $dir/$n"; else echo "  MISSING $dir/$n"; exit 1; fi
            done
          done

      - name: Every library the app links
        run: |
          MISSING=0
          EXTRA=""
          if [ "${{ inputs.dx12 }}" = "true" ]; then EXTRA="app/Madeira/libMoltenVK.a"; fi
          for f in $EXTRA FEX/build-ios/FEXCore/Source/libFEXCore.a FEX/build-ios/FEXCore/Source/libFEXCore_Base.a FEX/build-ios/FEXCore/Source/libJemallocLibs.a FEX/build-ios/External/fmt/libfmt.a FEX/build-ios/External/cephes/libcephes_128bit.a FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a app/Madeira/libntdll_unix.a app/Madeira/libwin32u_unix.a app/Madeira/libwineserver.a app/Madeira/libdxmt_combined.a app/Madeira/libgnutls.a app/Madeira/libhogweed.a app/Madeira/libnettle.a app/Madeira/libgmp.a; do
            if [ -f "$f" ]; then echo "  OK      $f  $(du -h "$f" | cut -f1)"; else echo "  MISSING $f"; MISSING=1; fi
          done
          if [ "$MISSING" -eq 1 ]; then echo "::error::a linked library is missing"; exit 1; fi

      - name: xcodebuild (unsigned)
        run: |
          # MoltenVK: -force_load, because its Objective-C category objects have
          # no symbol anything references and would otherwise be left out.
          # The project sets no OTHER_LDFLAGS, so nothing is overridden.
          LDFLAGS_ARG=()
          if [ "${{ inputs.dx12 }}" = "true" ]; then
            LDFLAGS_ARG=("OTHER_LDFLAGS=-force_load $PWD/app/Madeira/libMoltenVK.a -framework IOSurface -framework CoreGraphics")
          fi
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira -configuration Release -sdk iphoneos -derivedDataPath build-out CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" "${LDFLAGS_ARG[@]}" build > /tmp/xb.log 2>&1 || { grep -E 'error:|ld: |Undefined symbols|duplicate symbol' -A 3 /tmp/xb.log | sort -u | head -60; exit 1; }
          tail -3 /tmp/xb.log

      - name: Package IPA
        run: |
          APP=$(find build-out/Build/Products -maxdepth 2 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::no .app"; exit 1; }
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          # IOSDisplayShim.m: if macdrv_functions is not exported, DXMT cannot
          # find a CAMetalLayer and every D3D11 title exits 3 on a white screen.
          if xcrun dyld_info -exports "$BIN" 2>/dev/null | grep -q macdrv_functions; then
            echo "macdrv_functions exported: OK"
          else
            echo "::error::macdrv_functions missing from the export trie (DXMT would white-screen)"; exit 1
          fi
          echo "DLLs: aarch64 $(ls "$APP/aarch64-windows" | wc -l | tr -d ' '), arm64ec $(ls "$APP/arm64ec-windows" | wc -l | tr -d ' ')"
          SUFFIX=""
          if [ "${{ inputs.dx12 }}" = "true" ]; then
            SUFFIX="-dx12"
            # Proof by content that each D3D12 piece reached the binary.
            for s in 'winevulkan_unix_call_funcs' '[vulkan-ios] metal surface' 'MoltenVK'; do
              if grep -a -q -F "$s" "$BIN"; then echo "  binary has: $s"; else echo "::error::binary lacks: $s"; exit 1; fi
            done
            grep -a -q 'dxgi bridge: hooked factory vtable' "$APP/arm64ec-windows/d3d12core.dll" && echo "  d3d12core.dll has the DXGI bridge"
          fi
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          cat > Payload/entitlements.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>get-task-allow</key><true/>
            <key>com.apple.developer.kernel.increased-memory-limit</key><true/>
            <key>com.apple.developer.kernel.extended-virtual-addressing</key><true/>
          </dict></plist>
          PLIST
          zip -qry "Madeira-full${SUFFIX}-${GITHUB_RUN_NUMBER}.ipa" Payload
          ls -lh Madeira-full-*.ipa
          echo "binary: $(du -h "$BIN" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: Madeira-full-ipa
          path: Madeira-full-*.ipa
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            /tmp/xb.log
            /tmp/dxmt.log
            /tmp/ntdll.log
            /tmp/win32u.log
          retention-days: 7
          if-no-files-found: ignore
