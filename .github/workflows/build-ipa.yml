name: Build Madeira IPA

# You build on Windows; Madeira needs Xcode. This runs the app build on a macOS
# runner and hands back an unsigned IPA as a private, expiring artifact.
#
# It deliberately does NOT rebuild Wine, FEX or DXMT by default. 236 prebuilt
# binaries are already committed in-tree (the Wine DLLs, libdxmt_unix.a,
# libwineserver.a), and build/dxmt-ios/build.sh expects a custom LLVM-for-iOS
# under toolchains/ that is not in the repo at all. So the fast path is: build
# the Xcode app against what is already there.
#
# Nothing is published. The artifact is private to this repo and expires.

on:
  workflow_dispatch:
    inputs:
      submodules:
        description: "Check out wine/FEX/dxmt submodules (slow, ~1.2 GB, only needed to rebuild them)"
        type: boolean
        default: false
      configuration:
        description: "Xcode configuration"
        type: choice
        options: [Release, Debug]
        default: Release

permissions:
  contents: read

jobs:
  # The Xcode project copies app/Madeira/x86_64-vcruntime in as a resource and it
  # is gitignored -- Microsoft redistributables, so upstream documents fetching
  # them (tools/fetch-vcruntime.md) rather than committing them.
  #
  # That doc's route does not work any more: it points at .rsrc/1033/CABINET/*.cab,
  # but VC_redist.x64.exe is now a WiX burn bundle that 7-Zip will not unpack --
  # a 25 MB installer yields ~590 KB of extensionless stubs and no payload.
  #
  # GitHub's Windows runners already carry the redistributable inside Visual
  # Studio, byte-for-byte as Microsoft shipped it, so take it from there. They
  # must not be re-signed or have certificates stripped: FEX runs this as real
  # x86 code.
  vcruntime:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Collect the x64 CRT from the installed Visual Studio redist
        shell: pwsh
        run: |
          $wanted = @(
            'concrt140.dll','msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll',
            'msvcp140_atomic_wait.dll','msvcp140_codecvt_ids.dll','vcamp140.dll',
            'vccorlib140.dll','vcomp140.dll','vcruntime140.dll',
            'vcruntime140_1.dll','vcruntime140_threads.dll'
          )
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $roots = Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Redist\MSVC' -Directory -ErrorAction SilentlyContinue
          if (-not $roots) { Write-Error 'no VC Redist directory on this runner'; exit 1 }
          foreach ($name in $wanted) {
            $hit = Get-ChildItem -Path $roots.FullName -Recurse -Filter $name -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
            if ($hit) {
              Copy-Item $hit.FullName -Destination "out\$name"
              '{0,-32} {1,10} bytes' -f $name, $hit.Length
            } else {
              "MISSING  $name"
            }
          }
          $got = (Get-ChildItem out).Count
          "collected $got of $($wanted.Count)"
          if ($got -lt 10) { Write-Error "only $got DLLs found - the runner image layout changed"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-vcruntime
          path: out/
          retention-days: 1

  ipa:
    needs: vcruntime
    # ContentView.swift uses .glassEffect(.regular), which is the iOS 26 Liquid
    # Glass API -- so this needs Xcode 26 and the iOS 26 SDK. macos-15's default
    # Xcode is older and fails with "no member 'glassEffect'".
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}
          fetch-depth: 1

      - name: Select the newest Xcode and check the SDK
        run: |
          set -euo pipefail
          echo "Xcodes on this image:"
          ls -d /Applications/Xcode*.app 2>/dev/null | sed 's/^/  /' || echo "  (none beyond the default)"
          NEWEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST"
            echo "selected: $NEWEST"
          fi
          echo "Xcode:    $(xcodebuild -version | head -1)"
          SDKV="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK:  $SDKV"
          echo "clang:    $(xcrun --sdk iphoneos clang --version | head -1)"
          # app/Madeira/ContentView.swift calls .glassEffect(.regular), iOS 26+.
          MAJOR="${SDKV%%.*}"
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::iOS SDK $SDKV is too old - ContentView.swift needs the iOS 26 SDK for .glassEffect(). No Xcode 26 on this runner image."
            exit 1
          fi

      # What the project actually offers. If the build below picks the wrong
      # scheme, this output is where the right name comes from.
      - name: Discover schemes and targets
        id: discover
        run: |
          set -euo pipefail
          xcodebuild -list -project app/Madeira.xcodeproj | tee /tmp/list.txt
          SCHEME="$(awk '/Schemes:/{f=1;next} f && NF {print $1; exit}' /tmp/list.txt)"
          [ -n "$SCHEME" ] || SCHEME=Madeira
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using scheme: $SCHEME"

      # Confirm the prebuilt libraries the app links against are present. If any
      # of these are missing the link will fail with something far less obvious.
      - name: Check committed prebuilt artifacts
        run: |
          set -euo pipefail
          missing=0
          for lib in app/libdxmt_unix.a app/Madeira/libwineserver.a; do
            if [ -f "$lib" ]; then
              printf '  present  %-40s %s\n' "$lib" "$(du -h "$lib" | cut -f1)"
            else
              printf '  MISSING  %s\n' "$lib"; missing=1
            fi
          done
          echo "  Windows DLLs: $(find app/Madeira -name '*.dll' | wc -l | tr -d ' ')"
          [ "$missing" -eq 0 ] || echo "::warning::a prebuilt library is missing; the link step may fail"

      # The Xcode project copies app/Madeira/x86_64-vcruntime as a resource, and
      # it is gitignored - those are Microsoft redistributables, so the author
      # documented fetching them instead of committing them (tools/fetch-vcruntime.md).
      # Without this the build fails at:
      #   error: lstat(app/Madeira/x86_64-vcruntime): No such file or directory
      # They must stay byte-for-byte as Microsoft shipped them: no re-signing,
      # no stripping certificates.
      - name: Bring in the x64 CRT built by the windows job
        uses: actions/download-artifact@v4
        with:
          name: x86_64-vcruntime
          path: app/Madeira/x86_64-vcruntime

      - name: Verify the CRT landed
        run: |
          set -euo pipefail
          echo "$(ls app/Madeira/x86_64-vcruntime | wc -l | tr -d ' ') files:"
          ls -l app/Madeira/x86_64-vcruntime | sed 's/^/  /'
          for want in concrt140.dll msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            [ -f "app/Madeira/x86_64-vcruntime/$want" ] || { echo "::error::$want missing"; exit 1; }
          done

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme "${{ steps.discover.outputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -sdk iphoneos \
            -derivedDataPath build-out \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            build 2>&1 | tee /tmp/xcodebuild.log | xcbeautify || {
              echo "::error::build failed - see the xcodebuild-log artifact"
              tail -80 /tmp/xcodebuild.log
              exit 1
            }

      # get-task-allow is what lets StikDebug attach and grant JIT. Without it
      # FEX cannot generate code and nothing runs. The memory entitlements are
      # the ones this device actually honours - the CP2077 work confirmed
      # extended-virtual-addressing is live (maps landing at ~456 GB).
      - name: Write sideloading entitlements
        run: |
          cat > entitlements.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>get-task-allow</key><true/>
            <key>com.apple.developer.kernel.increased-memory-limit</key><true/>
            <key>com.apple.developer.kernel.extended-virtual-addressing</key><true/>
          </dict>
          </plist>
          PLIST
          cat entitlements.plist

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find build-out/Build/Products -maxdepth 2 -name '*.app' -print -quit)"
          [ -n "$APP" ] || { echo "::error::no .app was produced"; find build-out -maxdepth 4 -type d | head -40; exit 1; }
          echo "app bundle: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          cp entitlements.plist Payload/
          zip -qry "Madeira-${GITHUB_RUN_NUMBER}.ipa" Payload
          ls -lh "Madeira-${GITHUB_RUN_NUMBER}.ipa"

      - name: Upload IPA (private, expires)
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-ipa-${{ github.run_number }}
          path: Madeira-*.ipa
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: /tmp/xcodebuild.log
          retention-days: 7
