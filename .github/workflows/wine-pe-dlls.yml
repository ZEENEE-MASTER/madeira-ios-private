name: Build missing Wine PE DLLs

# Tier 0 (+ the PE half of Tier 2).
#
# The DLLs in app/Madeira/{aarch64,arm64ec}-windows/ are WINDOWS PE binaries
# cross-compiled with llvm-mingw. They have nothing to do with iOS, so they build
# on Linux and need no Mac, no Xcode and no iOS SDK. That makes this the one part
# of the stack that is not blocked behind the FEX build.
#
# Madeira ships 110/120 DLLs; the wine fork can build 730. This adds what games
# actually miss:
#
#   XAudio2      UE5 and Unity's default Windows audio backend. Absent entirely
#                -- zero of the 23 xaudio2/x3daudio/xapofx DLLs are shipped.
#                dlls/xaudio2_9/Makefile.in imports $(FAUDIO_PE_LIBS) and
#                libs/faudio is bundled, so FAudio compiles INTO the PE DLL.
#                No unixlib, no external fetch.
#   d3d8/10/ddraw  older D3D, routed through the already-shipped wined3d.
#   MSVC runtimes  common game prerequisites.
#   winevulkan + vulkan-1  the PE half of the DX12 chain:
#                d3d12.dll -> libs/vkd3d (bundled) -> vulkan-1 -> winevulkan
#                -> an ICD. All free except the ICD, which is MoltenVK and is
#                the only genuinely hard part of Tier 2.
#
# Audio output underneath this already works: build/ntdll-unix/audio_null_ios.c
# is a real 1046-line RemoteIO AudioUnit driver despite its name, statically
# linked into the app. So XAudio2 lands on a working chain, not a stub.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated dll dirs to build (blank = default set)"
        default: ""

permissions:
  contents: read

jobs:
  pe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch the wine submodule
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 wine
          cd wine && echo "wine $(cat VERSION)" && git log --oneline -1

      - name: Host build deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison pkg-config gettext autoconf perl \
            python3 curl xz-utils

      # llvm-mingw is what provides aarch64 AND arm64ec Windows targets; the
      # distro mingw packages do not do arm64ec at all.
      - name: Install llvm-mingw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Authenticated: the bare API call is rate-limited to a 403, which
          # leaves the tag empty and builds a garbage download URL.
          URL=$(gh api repos/mstorsjo/llvm-mingw/releases/latest --jq '.assets[] | select(.name|endswith("ucrt-ubuntu-22.04-x86_64.tar.xz")) | .browser_download_url')
          if [ -z "$URL" ]; then echo "::error::could not resolve llvm-mingw asset"; exit 1; fi
          echo "asset: $URL"
          curl -fsSL "$URL" -o /tmp/llvm-mingw.tar.xz
          sudo mkdir -p /opt
          sudo tar -xf /tmp/llvm-mingw.tar.xz -C /opt
          DIR=$(ls -d /opt/llvm-mingw-* | head -1)
          echo "$DIR/bin" >> "$GITHUB_PATH"
          echo "installed $DIR"
          "$DIR/bin/aarch64-w64-mingw32-clang" --version | head -1
          echo "arm64ec tools:"
          ls "$DIR/bin" | grep -i arm64ec | head -5 || echo "  none found"

      - name: Configure wine for aarch64 + arm64ec PE
        working-directory: wine
        run: |
          set -euo pipefail
          ./configure \
            --enable-archs=aarch64,arm64ec \
            --without-x --without-freetype --without-fontconfig \
            --without-alsa --without-oss --without-pulse --without-coreaudio \
            --without-gstreamer --without-opengl --without-vulkan \
            --disable-tests \
            2>&1 | tail -30

      # `make dlls/<name>` returned 0 for all 17 modules and produced nothing,
      # so it is a no-op target rather than a build. Find out what the generated
      # Makefile actually calls these.
      # Back to per-target. A plain `make` builds the UNIX side too, and this
      # fork's Unix side does not link outside Madeira's own build chain:
      #   ld: dlls/win32u/dibdrv/bitblt.o: undefined reference to `ios_srcwatch_arm`
      # That symbol lives in Madeira's build/win32u-unix/, not in the wine tree.
      # We only want PE DLLs, and naming the PE target explicitly builds only
      # those. Run 2 proved this works: 17/17.
      #
      # aarch64-windows only, deliberately. With both arches enabled Wine emits
      # ARM64X hybrids (tools/makedep.c pairs arm64ec into aarch64), verified by
      # parsing the artifacts' PE load config: 0x140, the CHPE-extended layout.
      # One file serves both ARM64 and ARM64EC processes, so the same binaries
      # go into arm64ec-windows/ too.
      - name: Build the PE DLLs
        working-directory: wine
        run: |
          set -euo pipefail
          DEFAULT="xaudio2_0 xaudio2_1 xaudio2_2 xaudio2_3 xaudio2_4 xaudio2_5 xaudio2_6 xaudio2_7 xaudio2_8 xaudio2_9 x3daudio1_0 x3daudio1_1 x3daudio1_2 x3daudio1_3 x3daudio1_4 x3daudio1_5 x3daudio1_6 x3daudio1_7 xapofx1_1 xapofx1_2 xapofx1_3 xapofx1_4 xapofx1_5 xinput1_1 xinput1_2 xinput1_3 xinput1_4 xinput9_1_0 d3d8 d3d10 d3d10_1 ddraw dinput msvcp100 msvcp110 msvcp120 msvcr100 msvcr110 atl100 dxdiagn wbemprox xolehlp winevulkan vulkan-1"
          TARGETS="${{ inputs.targets }}"
          if [ -z "$TARGETS" ]; then TARGETS="$DEFAULT"; fi
          make -j"$(nproc)" tools 2>&1 | tail -5

          BUILT=0; FAILED=""
          for t in $TARGETS; do
            if make -j"$(nproc)" "dlls/$t/aarch64-windows/$t.dll" > /tmp/m.log 2>&1; then
              echo "  OK      $t.dll"
              BUILT=$((BUILT + 1))
            else
              echo "  FAILED  $t"
              tail -4 /tmp/m.log | sed 's/^/            /'
              FAILED="$FAILED $t"
            fi
          done
          echo "BUILT: $BUILT"
          if [ -n "$FAILED" ]; then echo "::warning::did not build:$FAILED"; fi
          if [ "$BUILT" -eq 0 ]; then echo "::error::nothing built"; exit 1; fi

      - name: Collect what was produced
        run: |
          set -euo pipefail
          mkdir -p out/aarch64-windows out/arm64ec-windows
          find wine/dlls -path "*/aarch64-windows/*.dll" -exec cp {} out/aarch64-windows/ ';' 2>/dev/null || true
          # Same ARM64X hybrids serve both process types.
          cp out/aarch64-windows/*.dll out/arm64ec-windows/ 2>/dev/null || true
          for arch in aarch64-windows arm64ec-windows; do
            echo "$arch: $(ls "out/$arch" | wc -l) dlls"
          done
          ls out/aarch64-windows | sed 's/^/    /' || true
          echo "=== headline check ==="
          for a in aarch64-windows arm64ec-windows; do
            for d in xaudio2_9.dll x3daudio1_7.dll winevulkan.dll; do
              if [ -f "out/$a/$d" ]; then echo "  OK      $a/$d"; else echo "  absent  $a/$d"; fi
            done
          done
          TOTAL=$(find out -name "*.dll" | wc -l)
          echo "total: $TOTAL"
          if [ "$TOTAL" -eq 0 ]; then echo "::error::no DLLs produced"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: wine-pe-dlls
          path: out/
          retention-days: 7
